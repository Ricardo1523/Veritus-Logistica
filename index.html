<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Veritus Engenharia — Sistema Logístico de Controle de Produção de Caminhões. Acesse o sistema para gerenciar operações logísticas.">
  <title>Veritus Engenharia — Login</title>
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1724">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Veritus">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <main class="login" id="login-page">
    <div class="login__card">
      <!-- Logo -->
      <div class="login__logo">
        <div class="login__logo-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/>
            <path d="M15 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 13.52 9H12"/>
            <circle cx="17" cy="18" r="2"/>
            <circle cx="7" cy="18" r="2"/>
          </svg>
        </div>
        <h1 class="login__title">Veritus Engenharia</h1>
        <p class="login__subtitle">Controle de Produção de Caminhões</p>
      </div>

      <!-- Formulário -->
      <form class="login__form" id="login-form" onsubmit="return false;">
        <div class="form-group">
          <label class="form-group__label" for="operador">Operador</label>
          <input 
            type="text" 
            class="input-field" 
            id="operador" 
            name="operador" 
            placeholder="Digite seu ID de operador"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-group__label" for="senha">Senha</label>
          <input 
            type="password" 
            class="input-field" 
            id="senha" 
            name="senha" 
            placeholder="Digite sua senha"
            autocomplete="current-password"
          >
        </div>

        <div class="login__actions">
          <button type="button" class="btn btn--primary btn--full btn--lg" id="btn-login">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Acessar Sistema
          </button>
        </div>

        <div class="login__footer-link">
          Não tem conta? <a href="#" id="link-to-register">Cadastre-se</a>
        </div>
      </form>

      <!-- Formulário de Cadastro -->
      <form class="login__form" id="register-form" style="display: none;" onsubmit="return false;">
        <div class="form-group">
          <label class="form-group__label" for="reg-nome">Nome Completo</label>
          <input 
            type="text" 
            class="input-field" 
            id="reg-nome" 
            placeholder="Digite seu nome completo"
          >
        </div>

        <div class="form-group">
          <label class="form-group__label" for="reg-operador">Nome de Usuário (Login)</label>
          <input 
            type="text" 
            class="input-field" 
            id="reg-operador" 
            placeholder="Crie seu ID de acesso (ex: ricardo)"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-group__label" for="reg-senha">Senha</label>
          <input 
            type="password" 
            class="input-field" 
            id="reg-senha" 
            placeholder="Crie uma senha (mín. 6 caracteres)"
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label class="form-group__label" for="reg-perfil">Modalidade de Acesso</label>
          <select class="input-field" id="reg-perfil">
            <option value="analitico">📈 Usuário Analítico (Dashboard e Operações)</option>
            <option value="motorista">🚛 Usuário Motorista (Gerador de QR Code)</option>
          </select>
        </div>

        <div class="login__actions">
          <button type="button" class="btn btn--primary btn--full btn--lg" id="btn-registrar">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <line x1="19" y1="8" x2="19" y2="14"/>
              <line x1="22" y1="11" x2="16" y2="11"/>
            </svg>
            Criar Minha Conta
          </button>
        </div>

        <div class="login__footer-link">
          Já tem conta? <a href="#" id="link-to-login">Acessar Sistema</a>
        </div>
      </form>
    </div>
  </main>

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Elementos do Formulário de Login
      var loginForm = document.getElementById('login-form');
      var registerForm = document.getElementById('register-form');
      var btnLogin = document.getElementById('btn-login');
      var inputOperador = document.getElementById('operador');
      var inputSenha = document.getElementById('senha');
      var loginSubtitle = document.querySelector('.login__subtitle');

      // Elementos do Formulário de Registro
      var btnRegistrar = document.getElementById('btn-registrar');
      var inputRegNome = document.getElementById('reg-nome');
      var inputRegOperador = document.getElementById('reg-operador');
      var inputRegSenha = document.getElementById('reg-senha');
      var selectRegPerfil = document.getElementById('reg-perfil');

      // Alternar entre Telas
      var linkToRegister = document.getElementById('link-to-register');
      var linkToLogin = document.getElementById('link-to-login');

      linkToRegister.addEventListener('click', function (e) {
        e.preventDefault();
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        loginSubtitle.textContent = 'Cadastro de Usuário / Motorista';
      });

      linkToLogin.addEventListener('click', function (e) {
        e.preventDefault();
        registerForm.style.display = 'none';
        loginForm.style.display = 'block';
        loginSubtitle.textContent = 'Controle de Produção de Caminhões';
      });

      // ── LOGIC: LOGIN ──────────────────────────────────────────

      btnLogin.addEventListener('click', function () {
        var nome = (inputOperador.value || '').trim();
        var senha = (inputSenha.value || '').trim();

        if (!nome) {
          inputOperador.style.borderColor = 'var(--accent-primary)';
          inputOperador.style.boxShadow = '0 0 0 3px var(--accent-primary-light)';
          inputOperador.focus();
          return;
        }

        if (!senha) {
          inputSenha.style.borderColor = 'var(--accent-primary)';
          inputSenha.style.boxShadow = '0 0 0 3px var(--accent-primary-light)';
          inputSenha.focus();
          return;
        }

        var email = nome.includes('@') ? nome : nome.toLowerCase() + '@veritus.com';

        if (typeof auth !== 'undefined' && typeof db !== 'undefined') {
          btnLogin.disabled = true;
          btnLogin.textContent = 'Autenticando...';

          auth.signInWithEmailAndPassword(email, senha)
            .then(function (userCredential) {
              var user = userCredential.user;
              return db.collection('usuarios').doc(user.uid).get()
                .then(function (doc) {
                  var role = 'analitico';
                  var displayName = user.displayName || nome;
                  if (doc.exists) {
                    role = doc.data().role || 'analitico';
                    displayName = doc.data().displayName || displayName;
                  }
                  localStorage.setItem('veritus_role', role);
                  VeritusStore.setOperador(displayName);

                  if (role === 'motorista') {
                    window.location.href = 'gerar-qr.html';
                  } else {
                    window.location.href = 'home.html';
                  }
                });
            })
            .catch(function (error) {
              console.error('[Auth] Erro ao autenticar:', error);
              btnLogin.disabled = false;
              btnLogin.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                Acessar Sistema
              `;

              var msg = 'Erro ao realizar login.';
              if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                msg = 'Senha incorreta para este operador.';
              } else if (error.code === 'auth/user-not-found') {
                msg = 'Operador não cadastrado no sistema.';
              } else if (error.code === 'auth/invalid-email') {
                msg = 'ID do operador inválido.';
              }
              VeritusUI.showToast('❌ ' + msg, 'error');
            });
        } else {
          localStorage.setItem('veritus_role', 'analitico');
          VeritusStore.setOperador(nome);
          window.location.href = 'home.html';
        }
      });

      // ── LOGIC: REGISTRO ────────────────────────────────────────

      btnRegistrar.addEventListener('click', function () {
        var nomeCompleto = (inputRegNome.value || '').trim();
        var usuario = (inputRegOperador.value || '').trim();
        var senha = (inputRegSenha.value || '').trim();
        var role = selectRegPerfil.value;

        if (!nomeCompleto) {
          inputRegNome.focus();
          VeritusUI.showToast('⚠️ Digite seu nome completo.', 'warning');
          return;
        }
        if (!usuario) {
          inputRegOperador.focus();
          VeritusUI.showToast('⚠️ Digite um nome de usuário para login.', 'warning');
          return;
        }
        if (senha.length < 6) {
          inputRegSenha.focus();
          VeritusUI.showToast('⚠️ A senha deve ter no mínimo 6 caracteres.', 'warning');
          return;
        }

        var email = usuario.includes('@') ? usuario : usuario.toLowerCase() + '@veritus.com';

        if (typeof auth !== 'undefined' && typeof db !== 'undefined') {
          btnRegistrar.disabled = true;
          btnRegistrar.textContent = 'Registrando...';

          auth.createUserWithEmailAndPassword(email, senha)
            .then(function (userCredential) {
              var user = userCredential.user;
              user.updateProfile({ displayName: nomeCompleto });

              return db.collection('usuarios').doc(user.uid).set({
                displayName: nomeCompleto,
                email: email,
                role: role
              }).then(function () {
                localStorage.setItem('veritus_role', role);
                VeritusStore.setOperador(nomeCompleto);

                VeritusUI.showToast('✅ Conta criada com sucesso!', 'success');
                setTimeout(function () {
                  if (role === 'motorista') {
                    window.location.href = 'gerar-qr.html';
                  } else {
                    window.location.href = 'home.html';
                  }
                }, 1500);
              });
            })
            .catch(function (error) {
              console.error('[Auth] Erro ao cadastrar:', error);
              btnRegistrar.disabled = false;
              btnRegistrar.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                </svg>
                Criar Minha Conta
              `;

              var msg = 'Erro ao criar conta.';
              if (error.code === 'auth/email-already-in-use') {
                msg = 'Este nome de usuário já está em uso.';
              } else if (error.code === 'auth/invalid-email') {
                msg = 'Formato de usuário inválido.';
              } else if (error.code === 'auth/weak-password') {
                msg = 'Senha muito fraca.';
              }
              VeritusUI.showToast('❌ ' + msg, 'error');
            });
        } else {
          localStorage.setItem('veritus_role', role);
          VeritusStore.setOperador(nomeCompleto);
          if (role === 'motorista') {
            window.location.href = 'gerar-qr.html';
          } else {
            window.location.href = 'home.html';
          }
        }
      });

      // Enter key submits login
      inputOperador.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') btnLogin.click();
      });
      inputSenha.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') btnLogin.click();
      });
    });
  </script>
  <script src="js/pwa-register.js"></script>
</body>
</html>
