<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Veritus Engenharia — Scanner de QR Code para leitura e registro de viagens de caminhões.">
  <title>Veritus Engenharia — Scanner</title>
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1724">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Veritus">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <div class="app app--with-nav">

    <!-- ── Header ── -->
    <header class="page-header" id="scanner-header">
      <div class="page-header__left">
        <svg class="page-header__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/>
          <rect width="5" height="5" x="3" y="16" rx="1"/><rect width="5" height="5" x="16" y="16" rx="1"/>
          <path d="M10 3h4"/><path d="M10 16h4"/><path d="M3 10v4"/><path d="M16 10v4"/>
        </svg>
        <h1 class="page-header__title">Scanner QR Code</h1>
      </div>
      <button class="page-header__action" id="btn-scanner-help" title="Ajuda" aria-label="Ajuda">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <path d="M12 17h.01"/>
        </svg>
      </button>
    </header>

    <!-- ── Conteúdo ── -->
    <main class="page-content scanner-content" id="scanner-content">

      <!-- Área de Preview da Câmera -->
      <div class="scanner-area" id="scanner-area">
        <div class="scanner-preview" id="scanner-preview">
          <svg class="scanner-preview__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
            <circle cx="12" cy="13" r="3"/>
          </svg>
          <p class="scanner-preview__title">Pronto para escanear</p>
          <p class="scanner-preview__text">Clique no botão abaixo para ativar a câmera</p>
        </div>
      </div>

      <!-- Botão Ativar Câmera -->
      <button class="btn btn--primary btn--full btn--lg" id="btn-ativar-camera" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
          <circle cx="12" cy="13" r="3"/>
        </svg>
        Ativar Câmera
      </button>

      <!-- Info Box: Formatos aceitos -->
      <div class="info-box" id="info-formatos">
        <p class="info-box__title">Formatos aceitos:</p>
        <p class="info-box__item">JSON: {"truck":"...","corte":"...","aterro":"..."}</p>
        <p class="info-box__item">Texto: CAMINHÃO|CORTE|ATERRO|CARGA</p>
      </div>

      <!-- Botão: Ver QR Codes de Teste -->
      <a href="#" class="btn btn--outline btn--full" id="btn-ver-qr-teste">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Ver QR Codes de Teste
      </a>
    </main>

    <!-- ── Bottom Nav ── -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Navegação principal">
      <a href="home.html" class="bottom-nav__item" id="nav-inicio">
        <svg class="bottom-nav__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span class="bottom-nav__label">Início</span>
      </a>
      <a href="scanner.html" class="bottom-nav__item bottom-nav__item--active" id="nav-scanner">
        <svg class="bottom-nav__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/>
          <rect width="5" height="5" x="3" y="16" rx="1"/><rect width="5" height="5" x="16" y="16" rx="1"/>
          <path d="M10 3h4"/><path d="M10 16h4"/><path d="M3 10v4"/><path d="M16 10v4"/>
        </svg>
        <span class="bottom-nav__label">Scanner</span>
      </a>
      <a href="historico.html" class="bottom-nav__item" id="nav-historico">
        <svg class="bottom-nav__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M12 7v5l4 2"/>
        </svg>
        <span class="bottom-nav__label">Histórico</span>
      </a>
      <a href="relatorios.html" class="bottom-nav__item" id="nav-relatorios">
        <svg class="bottom-nav__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
          <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
          <path d="M10 13H8"/><path d="M16 17H8"/><path d="M16 13h-2"/>
        </svg>
        <span class="bottom-nav__label">Relatórios</span>
      </a>
    </nav>
  </div>

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-init.js"></script>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/pwa-register.js"></script>
</body>
</html>
